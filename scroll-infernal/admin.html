<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#040908">
<title>Scroll Infernal · Administration</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23040908'/%3E%3Cpath d='M8 11l8 11 8-11z' fill='%2339ff7a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<noscript><p class="banner bad">JavaScript est nécessaire pour afficher le panneau d’administration.</p></noscript>

<!-- ============ Connexion (mot de passe) ============ -->
<div id="gate" hidden>
  <form class="gate-card" id="gate-form" novalidate>
    <div class="brand"><span class="logo" aria-hidden="true">▼</span><span>SCROLL <b>INFERNAL</b></span><em>ADMIN</em></div>
    <h1>Espace administrateur</h1>
    <p>Accès privé. Entre le mot de passe du serveur pour voir les statistiques et gérer les données des joueurs.</p>
    <input class="sr" type="text" name="username" value="admin" autocomplete="username" tabindex="-1" aria-hidden="true">
    <label for="pw">Mot de passe</label>
    <input id="pw" type="password" name="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
    <button class="btn primary" id="gate-btn" type="submit">Se connecter</button>
    <div class="gate-err" id="gate-err" role="alert"></div>
    <p class="gate-note">Les joueurs n’ont aucun accès à cette page : les données ne sont envoyées qu’après vérification du mot de passe.</p>
  </form>
</div>

<!-- ============ Tableau de bord ============ -->
<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <div class="brand"><span class="logo" aria-hidden="true">▼</span><span>SCROLL <b>INFERNAL</b></span><em>ADMIN</em></div>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Sections du panneau"></nav>
      <div class="actions">
        <button class="btn" id="refresh" type="button" aria-label="Actualiser les statistiques"><span class="ic" aria-hidden="true">↻</span><span class="t">&nbsp;Actualiser</span></button>
        <button class="btn ghost" id="logout" type="button"><span class="t-long">Déconnexion</span><span class="t-short">Quitter</span></button>
      </div>
    </div>
  </header>
  <main>
    <div class="statusbar">
      <span class="updated" id="updated" role="status" aria-live="polite">—</span>
      <label class="chk" title="Actualise automatiquement toutes les 15 secondes (seulement quand la page est affichée)"><input type="checkbox" id="auto"> Actualisation auto</label>
    </div>
    <div id="views"></div>
  </main>
</div>

<!-- bulle d'info des graphiques -->
<div id="tip" role="tooltip" hidden></div>

<!-- panneau de détail (partie, message) -->
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-title" hidden>
  <div class="dr-h"><h3 id="dr-title">Détail</h3><button class="btn sm ghost" id="dr-close" type="button" aria-label="Fermer le panneau">✕</button></div>
  <div class="dr-b" id="dr-body"></div>
  <div class="dr-f" id="dr-foot" hidden></div>
</aside>

<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/admin-charts.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
